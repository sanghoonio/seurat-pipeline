[project]
name = "seurat-pipeline-scvi"
version = "0.1.0"
description = "Python env for seurat-pipeline: scVI/sysVI integration (step 04), CellTypist annotation (step 05), reference export"
requires-python = ">=3.10,<3.13"
dependencies = [
    "scvi-tools>=1.1",
    "scanpy>=1.10",
    "anndata>=0.10",
    "scikit-misc>=0.3",   # scanpy highly_variable_genes(flavor="seurat_v3")
    "igraph>=0.11",       # scanpy leiden clustering (eval_latent.py)
    "leidenalg>=0.10",    # scanpy leiden clustering (eval_latent.py)
    "scipy>=1.11",
    "pandas>=2.0",
    "numpy>=1.24",
    "celltypist>=1.6",    # step 05 annotation.celltypist (scripts/celltypist/)
]

[tool.uv]
# CPU/MPS torch is fine at this scale (~35k cells); no CUDA pin needed on macOS.
