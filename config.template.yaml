# =============================================================================
# seurat-pipeline config template
# =============================================================================
# Copy this file to `config.yaml` and edit it for your dataset.
#
# Layout
#   Top level holds only shared settings: project, paths, samples, sample_metadata.
#   Every step's settings live in RUN BLOCKS, one per run of that step:
#     <step>:            the step's unlabeled run (label "default")
#     <step>/<label>:    a labeled run; a step can have several (e.g. 02_ambient/soupx
#                        and 02_ambient/decontx), each written to its own folder
#                        outputs/<step>/<label>/ and never overwriting the others.
#   A block is self-contained: it holds every setting that run uses. Keys it
#   leaves out take the built-in defaults shown in the blocks below (a key set to
#   null stays null). Nothing is inherited from other blocks.
#   A block may contain only the keys its step uses (listed above each block).
#
#   input: <label>   the run of the PREVIOUS step this run reads (absent = that
#                    step's unlabeled run). Quote it if it looks like a number or
#                    yes/no. Settings a step needs from earlier steps (e.g. the
#                    MT pattern for step 02) come from the runs it reads, not from
#                    this file.
#
# Running
#   One step, one run at a time:
#     Rscript scripts/02_ambient.R --config config.yaml --label decontx [--no-plots]
#   --label is needed when a step has several runs. ./run.sh config.yaml --report-only
#   lists every run with its status (success / failed / missing / stale ...).
#   A step only runs if its block exists; the input run must have finished.
#
# Steps
#   00_cell_calling -> 01_load_qc_metrics -> 02_ambient -> 03_doublets ->
#   04_filter -> 05_normalize -> 06_cluster -> 07_annotate
#   (00 is optional: needed only when 01 uses cells: emptydrops or union)
# =============================================================================


# -----------------------------------------------------------------------------
# Project metadata - shows up in every JSON summary.
# -----------------------------------------------------------------------------
project:
  name: "my-scrnaseq-project"        # short identifier, no spaces
  description: "Brief one-line description of the dataset"
  seed: 42                            # random seed used everywhere


# -----------------------------------------------------------------------------
# Paths. All non-absolute paths are resolved relative to `base_dir`.
# -----------------------------------------------------------------------------
paths:
  base_dir: "."
  output_dir: "outputs"               # one folder per run: outputs/<step>/<label>/
  log_dir: "logs"


# -----------------------------------------------------------------------------
# Samples - REQUIRED. One entry per Cell Ranger sample.
#   id        : short unique identifier (prefixes cell barcodes)
#   filtered  : Cell Ranger's filtered matrix (.h5 file or 10x mtx directory)
#   raw       : Cell Ranger's raw matrix. Needed for ambient correction (02) and
#               emptyDrops cell calling (00).
# Layouts:
#   cellranger count : <sample>/outs/filtered_feature_bc_matrix.h5 (+ raw_)
#   cellranger multi / Flex : <run>/outs/per_sample_outs/<id>/[count/]sample_filtered_feature_bc_matrix.h5
#   For Flex, `raw` must be the gene-level sample_raw_feature_bc_matrix.h5, not the
#   probe matrix. Raw matrices contribute barcodes only (features restricted to
#   the filtered matrix's).
# Any extra field (condition, donor, batch, ...) becomes a per-cell metadata column.
# -----------------------------------------------------------------------------
samples:
  - id: "sample1"
    filtered: "data/sample1/outs/filtered_feature_bc_matrix.h5"
    raw: "data/sample1/outs/raw_feature_bc_matrix.h5"
    condition: "control"
  - id: "sample2"
    filtered: "data/sample2/outs/filtered_feature_bc_matrix.h5"
    raw: "data/sample2/outs/raw_feature_bc_matrix.h5"
    condition: "treated"


# -----------------------------------------------------------------------------
# Sample metadata from a CSV (optional), for many per-sample fields. The listed
# columns are attached to every cell like inline fields. Every sample needs one
# row (extra rows ignored); a column that is also an inline field is an error.
# Summaries record the file path, md5 and column names, never values.
# -----------------------------------------------------------------------------
sample_metadata:
  file: null                          # CSV path (relative to base_dir); null = none
  id_column: "sample_id"              # column matching samples[].id
  columns: null                       # columns to attach; null = all


# =============================================================================
# RUN BLOCKS
# =============================================================================

# --- 00_cell_calling (optional) ---------------------------------------------
# Uses: cell_calling.emptydrops. Runs DropletUtils::emptyDrops on each raw matrix
# and records which barcodes emptyDrops and/or Cell Ranger called. Needs `raw`.
#   lower  : UMI total at/below which a barcode is not tested. *** low-RNA knob ***
#            a cell below `lower` cannot be recovered; test_ambient checks it.
#   niters : Monte-Carlo iterations; p-values floor at 1/(niters+1).
#   retain / alpha : null = emptyDrops auto (knee / MLE).
# 00_cell_calling:
#   cell_calling:
#     emptydrops: {fdr: 0.01, lower: 100, niters: 10000, retain: null, alpha: null, test_ambient: false}


# --- 01_load_qc_metrics ------------------------------------------------------
# Uses: cell_calling.cells, qc.metrics. Loads and merges the samples, computes
# per-cell QC metrics and their distributions (quantiles, violins).
#   cells: cellranger -> Cell Ranger's filtered cells (no 00 run needed)
#          emptydrops -> emptyDrops cells from the 00 run named by `input`
#          union      -> emptyDrops UNION Cell Ranger filtered (recovers low-RNA cells;
#                        lower 04_filter's nCount_min / nFeature_min to keep them)
#   metrics: mouse mt_pattern "^mt-". Probe panels (10x Flex) have few MT genes.
01_load_qc_metrics:
  cell_calling:
    cells: "cellranger"
  qc:
    metrics:
      mt_pattern: "^MT-"
      ribo_pattern: "^RP[SL]"


# --- 02_ambient ----------------------------------------------------------------
# Uses: ambient. SoupX (one contamination fraction per sample) or DecontX (one
# per cell; low-RNA cells get a larger correction). Needs `raw`. enabled: false
# passes counts through uncorrected.
#   skip_samples : leave these uncorrected (e.g. where the SoupX estimate fails
#                  or pins at a bound, which can happen on Flex)
02_ambient:
  ambient:
    enabled: true
    method: "soupx"                   # soupx | decontx
    round_to_int: true
    skip_samples: []
    soupx:
      contamination_range: [0.01, 0.8]
    decontx:
      use_background: true            # raw-matrix non-cell droplets anchor the profile
      max_iter: 500
      delta: [10, 10]                 # Beta prior on per-cell contamination
      estimate_delta: true


# --- 03_doublets ---------------------------------------------------------------
# Uses: doublets. scDblFinder per sample on every cell of the 02 run (before QC
# thresholds). Records calls and scores; 04_filter removes them.
#   expected_rate : prior doublet rate; null = scDblFinder's cell-count-scaled rate
03_doublets:
  doublets:
    enabled: true
    expected_rate: 0.05


# --- 04_filter -----------------------------------------------------------------
# Uses: qc.thresholds, qc.prefilter_umap, filter. Thresholds apply to the 02 run's
# corrected counts; any bound can be null (no filter on that side). Removed cells
# are kept (seurat_filtered_out.rds) with the reason and thresholds they failed.
#   prefilter_umap : embed all input cells coloured by kept / removal reason
#   filter.remove_doublets : drop the 03 run's called doublets
04_filter:
  qc:
    thresholds:
      nFeature_min: 200
      nFeature_max: 7500
      nCount_min: 500
      nCount_max: 50000
      percent_mt_max: 15.0
    prefilter_umap: false
  filter:
    remove_doublets: true


# --- 05_normalize --------------------------------------------------------------
# Uses: normalization, reduction.npcs. Normalization, variable features, PCA.
#   split_by : SCTransform each level of a metadata column separately; needed by
#              06 runs with integration.method rpca/cca (set it to their batch_var)
05_normalize:
  normalization:
    method: "SCTransform"             # SCTransform | LogNormalize (no integration)
    vars_to_regress: ["percent.mt"]
    split_by: null
    sctransform:
      variable_features: 3000
      vst_flavor: "v2"
    lognormalize:
      variable_features: 2000
      scale_factor: 10000
  reduction:
    npcs: 30


# --- 06_cluster ----------------------------------------------------------------
# Uses: integration, reduction.dims_use, reduction.umap, clustering, markers.
# Integration (optional), neighbors, UMAP, clustering at every resolution, and
# FindAllMarkers at the default resolution.
#   integration.method : harmony (on the 05 PCA) | rpca | cca (need 05 split_by) |
#                        scvi (count-based, bundled Python env: cd scripts/scvi && uv sync;
#                        cache kept with the 05 run, see scripts/scvi/README.md)
#   batch_var          : metadata column to integrate over, e.g. library or chemistry
06_cluster:
  integration:
    enabled: false
    method: "harmony"
    batch_var: "sample_id"
    scvi:
      python: null                    # null -> scripts/scvi/.venv/bin/python
      script: null
      model: "scvi"                   # scvi | sysvi
      n_latent: 30
      n_layers: 2
      gene_likelihood: "nb"
      dispersion: "gene"
      n_hvg: 2000
      min_cells_per_batch: 3
      include_genes: []
      max_epochs: null
      seed: null                      # null -> project.seed
  reduction:
    dims_use: 30                      # <= the 05 run's npcs
    umap:
      n_neighbors: 30
      min_dist: 0.3
  clustering:
    algorithm: "louvain"              # louvain | leiden
    resolutions: [0.3, 0.5, 0.8, 1.0]
    default_resolution: 0.5
  markers:                            # FindAllMarkers
    only_pos: true
    min_pct: 0.25
    logfc_threshold: 0.25
    test: "wilcox"


# --- 07_annotate ---------------------------------------------------------------
# Uses: annotation. Each method runs only when configured and writes its own
# metadata columns and per-cell CSV (annotation/ in the run folder); each reports
# its gene coverage. The per-cluster suggested label prefers Azimuth, then
# markers, then SingleR (override_azimuth types win over Azimuth).
07_annotate:
  annotation:
    azimuth:
      reference: null                 # e.g. lungref, pbmcref (azimuth.hubmapconsortium.org)
      primary_level: null             # e.g. ann_level_3; null = the reference's first level
      plot_levels: []
    singler:
      reference: null                 # celldex function name(s), string or list,
                                      # e.g. [MonacoImmuneData, BlueprintEncodeData]
      labels: "main"                  # main | fine
    celltypist:
      models: []                      # e.g. [Immune_All_Low] (celltypist.org/models)
      majority_voting: false
      python: null                    # null -> scripts/scvi/.venv/bin/python
      script: null
    custom_reference:
      path: null                      # Seurat reference RDS from scripts/refs/
      label_columns: []
      dims: 50
    markers:
      genes: null                     # compartment -> cell type -> [genes]; null = skip
      override_azimuth: []            # marker labels that win over Azimuth
      min_score: 0
    removed_cells: false              # label the 04 run's removed cells too
    compare_by: []                    # metadata columns to split diagnostics by


# =============================================================================
# Labeled variants: add more blocks for any step, e.g.
#
# 02_ambient/decontx:
#   ambient: {method: "decontx", round_to_int: true, decontx: {use_background: true}}
#
# 03_doublets/dx:
#   input: "decontx"
#   doublets: {enabled: true, expected_rate: 0.05}
#
# 04_filter/dx_floor100:
#   input: "dx"
#   qc: {thresholds: {nFeature_min: null, nFeature_max: 9000, nCount_min: 100,
#                     nCount_max: 60000, percent_mt_max: 5}}
# =============================================================================
