# =============================================================================
# seurat-pipeline config template
# =============================================================================
# Copy this file to `config.yaml` and edit for your dataset:
#   cp config.template.yaml config.yaml
#
# Every step of the pipeline reads from a single config file. Anything you
# don't override here uses the documented default. Sections marked REQUIRED
# must be filled in; everything else has sensible defaults.
# =============================================================================


# -----------------------------------------------------------------------------
# Project metadata - shows up in every JSON summary for reproducibility.
# -----------------------------------------------------------------------------
project:
  name: "my-scrnaseq-project"        # short identifier, no spaces
  description: "Brief one-line description of the dataset"
  seed: 42                            # random seed used everywhere


# -----------------------------------------------------------------------------
# Paths. All non-absolute paths are resolved relative to `base_dir`.
# Defaults work if you run `./run.sh` from the repo root.
# -----------------------------------------------------------------------------
paths:
  base_dir: "."
  output_dir: "outputs"               # RDS checkpoints, CSVs, JSON summaries, plots/
  log_dir: "logs"                     # per-step stdout/stderr logs


# -----------------------------------------------------------------------------
# Samples - REQUIRED. One entry per Cell Ranger sample.
#
# Each sample needs at minimum:
#   id           : a short unique identifier (used to prefix cell barcodes)
#   filtered_h5  : path to Cell Ranger's filtered H5 matrix
#   raw_h5       : path to Cell Ranger's raw H5 matrix (used by SoupX; optional
#                  but strongly recommended - SoupX is skipped per-sample if missing)
#
# Standard `cellranger count` output layout:
#   <sample_dir>/outs/filtered_feature_bc_matrix.h5
#   <sample_dir>/outs/raw_feature_bc_matrix.h5
#
# `cellranger multi` / Flex per-sample-outs layout:
#   <run_dir>/per_sample_outs/<sample_id>/count/sample_filtered_feature_bc_matrix.h5
#   <run_dir>/per_sample_outs/<sample_id>/count/sample_raw_feature_bc_matrix.h5
#
# You can add ANY extra fields (e.g. condition, batch, donor, timepoint) and
# they will automatically be attached to each cell as Seurat metadata columns.
# -----------------------------------------------------------------------------
samples:
  - id: "sample1"
    filtered_h5: "data/sample1/outs/filtered_feature_bc_matrix.h5"
    raw_h5: "data/sample1/outs/raw_feature_bc_matrix.h5"
    condition: "control"              # optional - any extra fields become metadata
    batch: "run1"

  - id: "sample2"
    filtered_h5: "data/sample2/outs/filtered_feature_bc_matrix.h5"
    raw_h5: "data/sample2/outs/raw_feature_bc_matrix.h5"
    condition: "treated"
    batch: "run1"

# NOTE on matrix paths:
#   - `filtered` / `raw` are the canonical field names; `filtered_h5` / `raw_h5`
#     are accepted aliases (kept for backward compatibility).
#   - Each may point at an .h5 file OR a 10x mtx DIRECTORY containing
#     barcodes.tsv.gz / features.tsv.gz / matrix.mtx.gz (Cell Ranger v3).
#   - For 10x Flex, `raw` must point at the gene-level matrix
#     (sample_raw_feature_bc_matrix.h5), NOT the probe matrix.
#   - When the raw matrix is used (emptydrops), its FEATURES are restricted to
#     the filtered matrix's feature set (raw keeps probes Cell Ranger excludes,
#     e.g. Flex DEPRECATED_* duplicates). Only barcodes come from raw.


# -----------------------------------------------------------------------------
# Cell calling (step 00_cell_calling). OPT-IN. Default keeps current behavior:
# use Cell Ranger's filtered cell set as-is.
#
#   method: filtered    -> use the Cell Ranger filtered matrix (default).
#   method: emptydrops  -> run DropletUtils::emptyDrops on the RAW matrix to
#                          recover low-RNA cells that Cell
#                          Ranger's filtered set discards. Requires `raw`.
#
#   use: union | emptydrops | filtered   (which set flows downstream)
#     union      = emptyDrops cells UNION Cell Ranger filtered (recommended)
#     emptydrops = emptyDrops cells only (use this to evaluate params cleanly)
#     filtered   = Cell Ranger filtered only (baseline for comparison)
#
# emptyDrops params:
#   fdr    : FDR cutoff to call a barcode a cell (default 0.01)
#   lower  : UMI total at/below which a barcode is treated as ambient and NOT
#            tested (default 100). *** CRITICAL LOW-RNA KNOB ***: a cell
#            with total UMI below `lower` is never tested and cannot be
#            recovered. Lower it (e.g. 50) to test more low-RNA candidates, at
#            the cost of compute and a noisier ambient estimate. Use
#            test_ambient to check whether `lower` is eating real cells.
#   niters : Monte-Carlo iterations for p-values (default 10000). p-values are
#            floored at 1/(niters+1); raise if FDR can't drop below your cutoff.
#   retain : total UMI above which a barcode is always kept (default null = auto
#            knee point).
#   alpha  : ambient overdispersion (default null = auto/MLE).
#   test_ambient : also score barcodes <= lower (diagnostic; default false).
#
# *** WARNING: pair this with QC thresholds below ***
# emptyDrops recovers low-UMI/low-gene cells. The step 03 QC thresholds
# nFeature_min / nCount_min filter on the SAME low-count axis, so the defaults
# (nFeature_min 200, nCount_min 500) will silently DELETE the low-RNA cells you
# just recovered. Lower them (e.g. nFeature_min ~50-100, nCount_min ~100) when
# cell-calling is on, and watch filter_summary.json retention.
# -----------------------------------------------------------------------------
cell_calling:
  method: "filtered"        # "filtered" or "emptydrops"
  use: "union"              # "union", "emptydrops", or "filtered"
  fdr: 0.01
  lower: 100
  niters: 10000
  retain: null              # null = auto (knee point)
  alpha: null               # null = auto (MLE)
  test_ambient: false


# -----------------------------------------------------------------------------
# Quality control thresholds - applied in step 03_filter.
#
# These are typical defaults for human 10x 3'/5' scRNA-seq. You will likely
# need to tune them based on the violin plots produced by step 01 and
# threshold_preview_pct in qc_summary.json. Any bound can be null = no filter
# on that side.
#
# For mouse data, set mt_pattern to "^mt-".
# For 10x Flex (probe-based) data the distributions can differ a lot from
# 3'/5' data - see comments below.
# -----------------------------------------------------------------------------
qc:
  nFeature_min: 200                   # min unique genes per cell
  nFeature_max: 7500                  # max unique genes per cell (doublet-ish)
  nCount_min: 500                     # min total UMIs per cell
  nCount_max: 50000                   # max total UMIs per cell
  percent_mt_max: 15.0                # max % mitochondrial reads
  mt_pattern: "^MT-"                  # human: "^MT-", mouse: "^mt-"
  ribo_pattern: "^RP[SL]"             # ribosomal gene pattern
  doublet_detection: true             # run scDblFinder per sample
  expected_doublet_rate: 0.05         # ~5% for typical 10x loading

  # ---- Tuning notes ----
  # 10x Flex / probe-based assays count only probe-panel genes (few
  #   mitochondrial, often no ribosomal), so these defaults may not transfer
  #   and percent.mt is a weaker signal there.


# -----------------------------------------------------------------------------
# SoupX ambient RNA decontamination (step 02).
# Requires raw_h5 per sample. Set enabled: false to skip entirely.
# -----------------------------------------------------------------------------
soupx:
  enabled: true
  contamination_range: [0.01, 0.8]    # bounds for autoEstCont
  round_to_int: true                  # round corrected counts to integers
  skip_samples: []                    # sample ids to leave uncorrected, e.g. where
                                      # autoEstCont fails or pins at a bound (can
                                      # happen on Flex; check soupx_summary.json)


# -----------------------------------------------------------------------------
# Normalization (step 04). SCTransform is recommended; LogNormalize is the
# alternative.
# -----------------------------------------------------------------------------
normalization:
  method: "SCTransform"               # "SCTransform" or "LogNormalize"

  # SCTransform options
  sct_vars_to_regress: ["percent.mt"] # variables regressed out during SCT
  sct_variable_features: 3000
  sct_vst_flavor: "v2"

  # LogNormalize options (used only when method == "LogNormalize")
  scale_factor: 10000
  log_variable_features: 2000


# -----------------------------------------------------------------------------
# Dimensionality reduction (step 04).
# -----------------------------------------------------------------------------
reduction:
  npcs: 30                            # number of PCs to compute
  dims_use: 30                        # number of PCs used for UMAP/clustering
  umap_n_neighbors: 30
  umap_min_dist: 0.3


# -----------------------------------------------------------------------------
# Clustering (step 04). Multiple resolutions are computed; one becomes default.
# -----------------------------------------------------------------------------
clustering:
  algorithm: "louvain"                # "louvain" or "leiden"
  resolutions: [0.3, 0.5, 0.8, 1.0]   # all are computed; columns kept on object
  default_resolution: 0.5             # which one is set as the default Idents


# -----------------------------------------------------------------------------
# Batch integration (step 04). Skipped automatically if only one sample.
#
# methods:
#   harmony  : works with SCTransform, fast, post-PCA correction (recommended)
#   rpca     : Seurat v5 IntegrateLayers with RPCAIntegration
#   cca      : Seurat v5 IntegrateLayers with CCAIntegration
# -----------------------------------------------------------------------------
integration:
  enabled: true
  method: "harmony"                   # harmony | rpca | cca | scvi
  batch_var: "sample_id"              # metadata column to integrate over (batch).
                                      # e.g. set to "chemistry" to correct an
                                      # assay effect across mixed chemistries.
  reference_sample: null              # optional reference sample id (unused by harmony)

  # --- scVI / sysVI (method: scvi) --------------------------------------------
  # Count-based deep integration for LARGE cross-technology gaps (e.g. probe-panel
  # vs whole-transcriptome) that harmony/rpca cannot bridge. OPT-IN and EXTERNAL:
  # needs the bundled Python env (one-time: `cd scripts/scvi && uv sync`). The
  # pipeline shells out to it; nothing Python loads unless method: scvi. Trained on
  # RAW RNA counts; SCT/PCA still run for the variance report + downstream markers.
  # Latent + cache live under outputs/scvi/<run_label>/. See scripts/scvi/README.md.
  scvi:
    python: null                      # null -> bundled scripts/scvi/.venv/bin/python
    script: null                      # null -> bundled scripts/scvi/scvi_integrate.py
    model: "scvi"                     # scvi | sysvi (sysvi = stronger mixing, cross-"system")
    n_latent: 30
    n_layers: 2                       # capacity / integration-strength lever
    gene_likelihood: "nb"             # nb | zinb | poisson
    dispersion: "gene"                # gene | gene-batch (per-batch noise)
    n_hvg: 2000
    min_cells_per_batch: 3            # shared gene space: keep genes seen in >=N cells in EVERY batch
    include_genes: []                 # force these markers into the model's gene set (if in shared space)
    max_epochs: null                  # null -> scvi cell-count heuristic
    run_label: "default"              # output tag so multiple param sets coexist
    seed: 42


# -----------------------------------------------------------------------------
# Cell type annotation (step 05). Every sub-section is OPTIONAL - leave a
# field unset (or null) to skip that annotation method.
#
# `marker_genes` is a free-form dictionary you can edit to match your tissue.
# Top level groups are "compartments" (just for organization); inside each
# compartment is a dict of cell_type -> list of marker genes. Each cell type
# gets a Seurat AddModuleScore, and the highest-scoring cell type per cluster
# becomes that cluster's marker-based label.
# -----------------------------------------------------------------------------
annotation:
  # Azimuth reference (https://azimuth.hubmapconsortium.org/references/)
  # Examples: "pbmcref", "lungref", "kidneyref", "heartref", "tonsilref",
  #           "bonemarrowref", "fetusref", "mousecortexref"
  # Set to null to skip Azimuth.
  azimuth_reference: null
  azimuth_levels: ["ann_level_3", "ann_finest_level"]   # tried in order

  # Marker-based labels that should OVERRIDE Azimuth in the suggested_label.
  # Use for cell types the Azimuth reference cannot represent (it has no class
  # for them, so it assigns the nearest one instead). Any cluster
  # whose marker_based_label is in this list keeps that label instead of Azimuth's.
  # Default: empty (Azimuth wins, original behavior).
  marker_override: []                  # e.g. ["<CellType>"], names as in marker_genes

  # SingleR celldex reference function name (called as `do.call(name, list())`)
  # Examples: "HumanPrimaryCellAtlasData", "BlueprintEncodeData",
  #           "DatabaseImmuneCellExpressionData", "MonacoImmuneData",
  #           "MouseRNAseqData", "ImmGenData"
  # Set to null to skip SingleR.
  singler_reference: null

  # Marker genes for AddModuleScore-based labeling.
  # Replace this PBMC starter with markers appropriate for your tissue.
  marker_genes:
    immune:
      T_cell: ["CD3D", "CD3E", "CD3G"]
      CD4_T: ["CD4", "IL7R"]
      CD8_T: ["CD8A", "CD8B"]
      NK: ["NKG7", "GNLY", "KLRD1"]
      B_cell: ["MS4A1", "CD79A", "CD19"]
      Plasma: ["JCHAIN", "MZB1", "IGHG1"]
      Monocyte: ["CD14", "FCGR3A", "S100A8"]
      Macrophage: ["CD68", "MARCO", "MSR1"]
      DC: ["FCER1A", "CD1C", "CLEC9A"]
      pDC: ["LILRA4", "IRF7", "IL3RA"]
    other:
      Erythrocyte: ["HBA1", "HBA2", "HBB"]
      Platelet: ["PPBP", "PF4"]
